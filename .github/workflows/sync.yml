name: Sync veřejné zakázky

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

# Synchronizace zapisuje data zpět do main. Běhy proto musí být sériové,
# jinak může pozdější build narazit na změny, které mezitím zapsal jiný běh.
concurrency:
  group: sync-verejne-zakazky
  cancel-in-progress: false

jobs:
  fetch-vu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests beautifulsoup4 pytest
      - name: Fetch official XMLdataVZ export
        run: python scripts/scrape_vu.py
      - name: Upload VU data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-vu
          path: data/xml/
          if-no-files-found: ignore

  fetch-registr:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests beautifulsoup4 pytest
      - name: Run regression tests
        run: pytest -q tests
      - name: Fetch Contract Register
        run: python scripts/import_registr_smluv.py
      - name: Validate Contract Register output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/registr_smluv/contracts.json")
          if not p.exists():
              raise SystemExit("Chybí data/registr_smluv/contracts.json")
          obj = json.loads(p.read_text(encoding="utf-8"))
          rows = obj.get("records", [])
          if not isinstance(rows, list) or not rows:
              raise SystemExit("Registr smluv vrátil 0 záznamů; build se zastavuje, aby nepřepsal platná data.")
          print(f"Validní Registr smluv: {len(rows)} záznamů")
          PY
      - name: Upload Registr smluv data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-registr
          path: |
            data/registr_smluv/
            data/sources/registr-smluv/
          if-no-files-found: ignore

  build:
    needs: [fetch-vu, fetch-registr]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download VU data
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: source-vu
          path: data/xml/
      - name: Download Registr smluv data
        continue-on-error: false
        uses: actions/download-artifact@v4
        with:
          name: source-registr
          path: data/
      - name: Validate downloaded source artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/registr_smluv/contracts.json")
          obj = json.loads(p.read_text(encoding="utf-8"))
          rows = obj.get("records", [])
          if not isinstance(rows, list) or not rows:
              raise SystemExit("Stažený artefakt Registru smluv neobsahuje žádné záznamy.")
          print(f"Artefakt obsahuje {len(rows)} záznamů Registru smluv")
          PY
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests beautifulsoup4 pytest
      - name: Run regression tests
        run: pytest -q tests
      - name: Normalize source records
        run: python scripts/normalize_sources.py
      - name: Validate normalized records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/sources/manifest.json")
          obj = json.loads(p.read_text(encoding="utf-8"))
          n = int(obj.get("registr_smluv_records", 0))
          if n <= 0:
              raise SystemExit("Normalizace vytvořila 0 záznamů; build se zastavuje.")
          print(f"Normalizováno {n} záznamů Registru smluv")
          PY
      - name: Resolve cross-source records
        run: python scripts/resolve_projects.py
      - name: Analyze projects
        run: python scripts/analyze_projects.py
      - name: Build provisional index
        run: python scripts/build_index.py
      - name: Commit collected data
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Automaticky aktualizovat data zakazek"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
