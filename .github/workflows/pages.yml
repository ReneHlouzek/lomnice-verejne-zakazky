name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/index.json"
      - "data/projects/**"
      - "data/changes/**"
      - "data/sources/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare web data
        run: |
          rm -rf public
          mkdir -p public
          cp -R site/. public/
          mkdir -p public/data
          cp -R data/index.json public/data/
          cp -R data/projects public/data/
          cp -R data/changes public/data/ 2>/dev/null || true
          cp -R data/sources public/data/ 2>/dev/null || true
          touch public/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
